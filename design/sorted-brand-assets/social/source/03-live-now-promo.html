<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1080px; overflow: hidden; }
  body {
    background: #0F2A24;
    font-family: 'Bricolage Grotesque', system-ui, sans-serif;
    color: #F2EEE3;
    position: relative;
  }
  .mark { position: absolute; top: 72px; left: 72px; width: 64px; height: 64px; }
  .word { position: absolute; top: 76px; left: 152px; font-weight: 800; font-size: 34px; letter-spacing: -0.045em; }
  .pill { position: absolute; top: 72px; right: 72px; background: #9BE07A; color: #0F2A24; font-family: 'IBM Plex Mono', monospace; font-weight: 500; font-size: 20px; letter-spacing: 0.1em; text-transform: uppercase; padding: 14px 26px; border-radius: 999px; }
  h1 { position: absolute; top: 300px; left: 72px; right: 72px; font-size: 100px; font-weight: 800; line-height: 1.03; letter-spacing: -0.03em; }
  h1 em { font-style: normal; color: #9BE07A; }
  .row { position: absolute; left: 72px; right: 72px; bottom: 170px; display: flex; gap: 24px; }
  .chip { flex: 1; background: rgba(242,238,227,0.08); border: 1px solid rgba(242,238,227,0.18); border-radius: 20px; padding: 28px 30px; }
  .chip p.n { font-family: 'IBM Plex Mono', monospace; font-weight: 500; font-size: 20px; color: #9BE07A; margin-bottom: 10px; }
  .chip p.t { font-size: 24px; font-weight: 700; color: #F2EEE3; }
  .footer { position: absolute; left: 72px; right: 72px; bottom: 72px; display: flex; justify-content: space-between; align-items: center; }
  .label { font-family: 'IBM Plex Mono', monospace; font-weight: 500; font-size: 20px; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(242,238,227,0.7); }
</style>
</head>
<body>
  <svg class="mark" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
    <rect width="64" height="64" rx="16" fill="#9BE07A"/>
    <rect x="14" y="18" width="36" height="7" rx="3.5" fill="#0F2A24"/>
    <rect x="14" y="29" width="29" height="7" rx="3.5" fill="#0F2A24"/>
    <rect x="14" y="40" width="16" height="7" rx="3.5" fill="#0F2A24"/>
  </svg>
  <div class="word">sorted</div>
  <div class="pill">Live now in Yaba</div>
  <h1>Your clothes, picked up <em>and returned.</em></h1>
  <div class="row">
    <div class="chip"><p class="n">01</p><p class="t">We collect</p></div>
    <div class="chip"><p class="n">02</p><p class="t">We clean</p></div>
    <div class="chip"><p class="n">03</p><p class="t">We return</p></div>
  </div>
  <div class="footer">
    <span class="label">Book on sorted.com.ng</span>
    <span class="label">Yaba, Lagos</span>
  </div>
</body>
</html>
