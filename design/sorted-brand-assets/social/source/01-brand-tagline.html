<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1080px; overflow: hidden; }
  body {
    background: #0F2A24;
    font-family: 'Bricolage Grotesque', system-ui, sans-serif;
    color: #F2EEE3;
    position: relative;
  }
  .mark { position: absolute; top: 72px; left: 72px; width: 64px; height: 64px; }
  .word { position: absolute; top: 76px; left: 152px; font-weight: 800; font-size: 34px; letter-spacing: -0.045em; }
  .content { position: absolute; left: 72px; right: 72px; top: 330px; }
  h1 { font-size: 122px; font-weight: 800; line-height: 0.98; letter-spacing: -0.03em; }
  h1 em { font-style: normal; color: #9BE07A; }
  .sub { margin-top: 36px; font-family: 'IBM Plex Mono', monospace; font-weight: 500; font-size: 24px; letter-spacing: 0.01em; color: rgba(242,238,227,0.72); max-width: 760px; line-height: 1.5; }
  .footer { position: absolute; left: 72px; right: 72px; bottom: 72px; display: flex; justify-content: space-between; align-items: center; }
  .label { font-family: 'IBM Plex Mono', monospace; font-weight: 500; font-size: 20px; letter-spacing: 0.14em; text-transform: uppercase; color: #9BE07A; }
</style>
</head>
<body>
  <svg class="mark" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
    <rect width="64" height="64" rx="16" fill="#9BE07A"/>
    <rect x="14" y="18" width="36" height="7" rx="3.5" fill="#0F2A24"/>
    <rect x="14" y="29" width="29" height="7" rx="3.5" fill="#0F2A24"/>
    <rect x="14" y="40" width="16" height="7" rx="3.5" fill="#0F2A24"/>
  </svg>
  <div class="word">sorted</div>
  <div class="content">
    <h1>Consider it<br><em>sorted.</em></h1>
    <p class="sub">Skilled Nigerian artisans and professionals you can trust — booked, done, and paid, all in one place.</p>
  </div>
  <div class="footer">
    <span class="label">sorted.com.ng</span>
    <span class="label">Lagos, Nigeria</span>
  </div>
</body>
</html>
