<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1080px; overflow: hidden; }
  body {
    background: #F2EEE3;
    font-family: 'Bricolage Grotesque', system-ui, sans-serif;
    color: #0F2A24;
    position: relative;
  }
  .mark { position: absolute; top: 72px; left: 72px; width: 64px; height: 64px; }
  .word { position: absolute; top: 76px; left: 152px; font-weight: 800; font-size: 34px; letter-spacing: -0.045em; }
  h1 { position: absolute; top: 230px; left: 72px; right: 72px; font-size: 68px; font-weight: 800; letter-spacing: -0.02em; }
  .steps { position: absolute; top: 352px; left: 72px; right: 72px; display: flex; flex-direction: column; gap: 20px; }
  .step { display: flex; align-items: center; gap: 28px; background: #FBF9F4; border: 1px solid rgba(15,42,36,0.12); border-radius: 24px; padding: 32px 36px; }
  .num { width: 64px; height: 64px; border-radius: 999px; background: #0F2A24; color: #9BE07A; font-family: 'IBM Plex Mono', monospace; font-weight: 500; font-size: 26px; display: flex; align-items: center; justify-content: center; flex: none; }
  .step h3 { font-size: 30px; font-weight: 700; letter-spacing: -0.01em; }
  .step p { font-family: 'IBM Plex Mono', monospace; font-weight: 500; font-size: 19px; color: rgba(15,42,36,0.6); margin-top: 6px; }
  .footer { position: absolute; left: 72px; right: 72px; bottom: 72px; display: flex; justify-content: space-between; align-items: center; }
  .label { font-family: 'IBM Plex Mono', monospace; font-weight: 500; font-size: 20px; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(15,42,36,0.55); }
</style>
</head>
<body>
  <svg class="mark" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
    <rect width="64" height="64" rx="16" fill="#0F2A24"/>
    <rect x="14" y="18" width="36" height="7" rx="3.5" fill="#F2EEE3"/>
    <rect x="14" y="29" width="29" height="7" rx="3.5" fill="#F2EEE3"/>
    <rect x="14" y="40" width="16" height="7" rx="3.5" fill="#9BE07A"/>
  </svg>
  <div class="word">sorted</div>
  <h1>Three steps. That's it.</h1>
  <div class="steps">
    <div class="step"><div class="num">01</div><div><h3>Post what you need</h3><p>Describe the job and your budget</p></div></div>
    <div class="step"><div class="num">02</div><div><h3>A pro gets it done</h3><p>Matched, booked, work completed</p></div></div>
    <div class="step"><div class="num">03</div><div><h3>Approve, then pay</h3><p>Payment releases only once you're happy</p></div></div>
  </div>
  <div class="footer">
    <span class="label">sorted.com.ng</span>
    <span class="label">Consider it sorted.</span>
  </div>
</body>
</html>
