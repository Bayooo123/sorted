<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enough by Sorted · Your account</title>
<meta name="description" content="Open your Enough account: verify your BVN and get your own account number for salary deposits.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FFC23C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=DM+Sans:wght@400..700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2B1B0E; --ground:#FFF8EC; --card:#FFFDF7; --line:#F0E2C6; --line-soft:#F6ECD8;
  --muted:#6B5843; --amber:#9A5B00; --sun:#FFC23C; --sun-soft:#FFE3A3; --sun-pale:#FFF1D1;
  --orange:#F28C28; --ember:#C2502A; --deep:#8A3B1E; --good:#2E7D4F; --good-soft:#E6F3EA;
  --display:'Bricolage Grotesque', 'Trebuchet MS', sans-serif;
  --body:'DM Sans', 'Segoe UI', Arial, sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh}
img{max-width:100%;display:block}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-0.02em;line-height:1.15}
:focus-visible{outline:3px solid var(--orange);outline-offset:3px;border-radius:6px}
.wrap{max-width:480px;margin:0 auto;padding:0 20px}
header.nav{padding:20px 0}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink)}
.brand span{font-family:var(--display);font-size:22px;font-weight:800;letter-spacing:-.02em}
.brand small{font-family:var(--body);font-size:13px;color:var(--muted);font-weight:500;margin-left:2px}
main{padding:12px 0 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px 24px;box-shadow:0 1px 0 rgba(43,27,14,.03)}
.card + .card{margin-top:16px}
h1.title{font-size:26px;margin-bottom:6px}
p.sub{color:var(--muted);margin:0 0 20px;font-size:15px}
label{display:block;font-size:14px;font-weight:700;margin:14px 0 6px;color:var(--amber)}
label:first-of-type{margin-top:0}
input,select{width:100%;height:50px;padding:0 14px;border:1.5px solid var(--line);border-radius:12px;font-family:var(--body);font-size:16px;background:#fff;color:var(--ink)}
textarea{width:100%;min-height:90px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;font-family:var(--body);font-size:15px;background:#fff;color:var(--ink);resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--orange);outline:none}
.field-row{position:relative}
.field-toggle{position:absolute;right:10px;top:38px;background:none;border:0;color:var(--amber);font-family:var(--body);font-weight:700;font-size:13px;cursor:pointer;padding:6px}
.hint{font-size:13px;color:var(--muted);margin-top:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;padding:0 20px;border-radius:26px;font-family:var(--body);font-weight:700;font-size:16px;text-decoration:none;border:0;cursor:pointer;margin-top:22px;transition:transform .15s ease, opacity .15s ease}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--ink);color:var(--sun)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-ghost{background:transparent;color:var(--amber);height:40px;margin-top:10px}
.btn-link{background:none;border:0;padding:0;margin-top:10px;color:var(--amber);font-family:var(--body);font-weight:700;font-size:13px;text-decoration:underline;cursor:pointer;text-align:left}
.btn-small{width:auto;height:40px;padding:0 18px;margin-top:0;font-size:14px}
.switcher{display:flex;gap:6px;background:var(--sun-pale);border-radius:14px;padding:4px;margin-bottom:22px}
.switcher button{flex:1;border:0;background:transparent;height:38px;border-radius:11px;font-family:var(--body);font-weight:700;font-size:14px;color:var(--amber);cursor:pointer}
.switcher button.active{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(43,27,14,.1)}
.banner{display:flex;gap:10px;align-items:flex-start;padding:14px 16px;border-radius:14px;font-size:14px;margin-bottom:18px}
.banner.error{background:#FBE6E0;color:var(--ember)}
.banner.info{background:var(--sun-pale);color:var(--amber)}
.banner.success{background:var(--good-soft);color:var(--good)}
.spinner{width:16px;height:16px;border-radius:50%;border:2.5px solid rgba(0,0,0,.15);border-top-color:currentColor;animation:spin .7s linear infinite;flex:none;margin-top:1px}
@keyframes spin{to{transform:rotate(360deg)}}
.status-pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:6px 12px;border-radius:999px}
.status-pill.pending{background:var(--sun-pale);color:var(--amber)}
.status-pill.active{background:var(--good-soft);color:var(--good)}
.status-pill.unsupported{background:#FBE6E0;color:var(--ember)}
.acct-number{font-family:var(--display);font-size:32px;font-weight:800;letter-spacing:.02em;margin:14px 0 2px}
.acct-bank{color:var(--muted);font-size:15px}
.balance{font-family:var(--display);font-size:40px;font-weight:800;margin:4px 0 0}
.balance-label{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.muted{color:var(--muted)}
.copy-btn{background:none;border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:13px;font-weight:700;color:var(--amber);cursor:pointer}
footer.foot{text-align:center;padding:30px 0;font-size:13px;color:var(--muted)}
.skeleton{height:100px;display:flex;align-items:center;justify-content:center;color:var(--muted);gap:10px;font-size:15px}
.purpose-list{margin-top:4px}
.purpose-row{padding:14px 0;border-bottom:1px solid var(--line-soft)}
.purpose-row:last-child{border-bottom:0}
.purpose-row-main{display:flex;justify-content:space-between;align-items:center;gap:10px}
.purpose-name{font-weight:700;font-size:15px}
.purpose-balance{font-family:var(--display);font-weight:700;font-size:16px}
.btn-small-row{display:flex;gap:8px;margin-top:8px}
.btn-primary-small{background:var(--ink);color:var(--sun)}
.btn-ghost-small{background:transparent;color:var(--amber);border:1px solid var(--line)}
.allocate-form{display:flex;gap:8px;margin-top:10px}
.allocate-form input{height:40px;flex:1}
.push-link{background:none;border:0;color:var(--amber);font-weight:700;font-size:13px;cursor:pointer;padding:0;margin-top:6px}
.new-purpose-form{margin-top:16px;padding-top:16px;border-top:1px dashed var(--line)}
.new-purpose-form input{margin-bottom:0}
.empty-purposes{color:var(--muted);font-size:14px;margin:0}
.tabbar{display:flex;gap:4px;background:var(--sun-pale);border-radius:16px;padding:4px;margin-bottom:16px}
.tab-btn{flex:1;border:0;background:transparent;height:44px;border-radius:12px;font-family:var(--body);font-weight:700;font-size:13px;color:var(--amber);cursor:pointer;padding:0 4px}
.tab-btn.active{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(43,27,14,.1)}
.history-list{margin-top:4px}
.history-row{padding:14px 0;border-bottom:1px solid var(--line-soft)}
.history-row:last-child{border-bottom:0}
.history-row-main{display:flex;justify-content:space-between;align-items:center;gap:10px}
.history-label{font-weight:700;font-size:14px}
.history-amount-in{font-family:var(--display);font-weight:700;font-size:15px;color:var(--good)}
.history-amount-out{font-family:var(--display);font-weight:700;font-size:15px;color:var(--ink)}
.history-date{display:block;margin-top:4px;font-size:12.5px;color:var(--muted)}
.plan-review{display:flex;flex-direction:column;gap:8px;margin-bottom:4px}
.plan-row{display:flex;align-items:center;gap:8px}
.plan-row .plan-name{flex:1}
.plan-row .plan-percent{width:70px;flex:none;text-align:right}
.target-pill{font-size:12px;color:var(--muted);font-weight:700;margin-left:6px}
.tranche-list{background:var(--sun-pale);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.tranche-row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.tranche-row-main{display:flex;flex-direction:column;gap:2px}
.unlock-tranche-form,.extend-schedule-form{display:flex;gap:8px;align-items:center}
.unlock-tranche-form input,.extend-schedule-form input{height:38px;width:90px}
</style>
</head>
<body>

<header class="nav">
  <div class="wrap">
    <a class="brand" href="#" aria-label="Enough home">
      <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="5" fill="#FFC23C" stroke="#2B1B0E" stroke-width="1.6"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3M4.6 4.6l2.1 2.1M17.3 17.3l2.1 2.1M4.6 19.4l2.1-2.1M17.3 6.7l2.1-2.1" stroke="#2B1B0E" stroke-width="1.6" stroke-linecap="round"/></svg>
      <span>enough</span><small>by Sorted</small>
    </a>
  </div>
</header>

<main class="wrap" id="app">
  <div class="card skeleton" id="loading-card">
    <div class="spinner"></div><span>Loading…</span>
  </div>
</main>

<footer class="foot wrap">Sorted Innovations Limited · RC 9770241</footer>

<script>
(function () {
  var API_BASE_URL = 'https://sorted-api.vercel.app';
  var TOKEN_KEY = 'enough_access_token';

  // Keep in sync with server/src/common/nigerian-states.ts.
  var NIGERIAN_STATES = [
    'Abia', 'Adamawa', 'Akwa Ibom', 'Anambra', 'Bauchi', 'Bayelsa', 'Benue', 'Borno',
    'Cross River', 'Delta', 'Ebonyi', 'Edo', 'Ekiti', 'Enugu', 'FCT (Abuja)', 'Gombe',
    'Imo', 'Jigawa', 'Kaduna', 'Kano', 'Katsina', 'Kebbi', 'Kogi', 'Kwara', 'Lagos',
    'Nasarawa', 'Niger', 'Ogun', 'Ondo', 'Osun', 'Oyo', 'Plateau', 'Rivers', 'Sokoto',
    'Taraba', 'Yobe', 'Zamfara',
  ];

  var app = document.getElementById('app');
  var state = { accessToken: localStorage.getItem(TOKEN_KEY) };

  function api(path, opts) {
    opts = opts || {};
    var headers = { 'Content-Type': 'application/json' };
    if (opts.auth) {
      if (!state.accessToken) return Promise.reject(new Error('Not signed in'));
      headers.Authorization = 'Bearer ' + state.accessToken;
    }
    return fetch(API_BASE_URL + path, {
      method: opts.method || 'GET',
      headers: headers,
      body: opts.body ? JSON.stringify(opts.body) : undefined,
    }).then(function (res) {
      return res.text().then(function (text) {
        var data = text ? JSON.parse(text) : undefined;
        if (!res.ok) {
          var message = (data && (data.message || data.error)) || ('Request failed (' + res.status + ')');
          var err = new Error(Array.isArray(message) ? message.join(', ') : message);
          err.status = res.status;
          throw err;
        }
        return data;
      });
    });
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function formatNaira(kobo) {
    var naira = Number(kobo) / 100;
    return '₦' + naira.toLocaleString('en-NG', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function formatAccountNumber(num) {
    if (!num) return '';
    return String(num).replace(/(\d{3})(?=\d)/g, '$1 ').trim();
  }

  // ---------- render helpers ----------

  function render(html) {
    app.innerHTML = html;
  }

  function renderAuthScreen(mode, errorMsg) {
    mode = mode || 'login';
    var stateOptions = NIGERIAN_STATES.map(function (s) {
      return '<option value="' + s + '">' + s + '</option>';
    }).join('');

    render(
      '<div class="card">' +
      '<h1 class="title">' + (mode === 'login' ? 'Welcome back' : 'Create your account') + '</h1>' +
      '<p class="sub">Sign in to open or check your Enough account.</p>' +
      (errorMsg ? '<div class="banner error">' + escapeHtml(errorMsg) + '</div>' : '') +
      '<div class="switcher">' +
        '<button type="button" data-mode="login" class="' + (mode === 'login' ? 'active' : '') + '">Log in</button>' +
        '<button type="button" data-mode="signup" class="' + (mode === 'signup' ? 'active' : '') + '">Sign up</button>' +
      '</div>' +
      '<form id="auth-form">' +
        (mode === 'signup'
          ? '<label for="f-name">Full name</label><input id="f-name" required maxlength="200">' +
            '<label for="f-phone">Phone</label><input id="f-phone" required placeholder="+2348012345678">' +
            '<label for="f-state">State</label><select id="f-state" required>' + stateOptions + '</select>' +
            '<label for="f-email">Email</label><input id="f-email" type="email" required>' +
            '<div class="field-row"><label for="f-password">Password</label><input id="f-password" type="password" required minlength="8">' +
              '<button type="button" class="field-toggle" data-target="f-password">Show</button></div>'
          : '<label for="f-identifier">Email or phone</label><input id="f-identifier" required>' +
            '<div class="field-row"><label for="f-password">Password</label><input id="f-password" type="password" required>' +
              '<button type="button" class="field-toggle" data-target="f-password">Show</button></div>' +
            '<button type="button" class="btn-link" id="forgot-password-link">Forgot password?</button>') +
        '<button type="submit" class="btn btn-primary" id="auth-submit">' + (mode === 'login' ? 'Log in' : 'Sign up') + '</button>' +
      '</form>' +
      '</div>'
    );

    var switcherBtns = app.querySelectorAll('.switcher button');
    Array.prototype.forEach.call(switcherBtns, function (btn) {
      btn.addEventListener('click', function () { renderAuthScreen(btn.getAttribute('data-mode')); });
    });

    var toggle = app.querySelector('.field-toggle');
    if (toggle) {
      toggle.addEventListener('click', function () {
        var input = document.getElementById(toggle.getAttribute('data-target'));
        var showing = input.type === 'text';
        input.type = showing ? 'password' : 'text';
        toggle.textContent = showing ? 'Show' : 'Hide';
      });
    }

    var forgotLink = document.getElementById('forgot-password-link');
    if (forgotLink) {
      forgotLink.addEventListener('click', function () {
        renderForgotPasswordScreen('request');
      });
    }

    document.getElementById('auth-form').addEventListener('submit', function (e) {
      e.preventDefault();
      var submitBtn = document.getElementById('auth-submit');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Please wait…';

      var req;
      if (mode === 'signup') {
        req = api('/auth/signup', {
          method: 'POST',
          body: {
            name: document.getElementById('f-name').value.trim(),
            phone: document.getElementById('f-phone').value.trim(),
            state: document.getElementById('f-state').value,
            email: document.getElementById('f-email').value.trim(),
            password: document.getElementById('f-password').value,
          },
        });
      } else {
        req = api('/auth/login', {
          method: 'POST',
          body: {
            identifier: document.getElementById('f-identifier').value.trim(),
            password: document.getElementById('f-password').value,
          },
        });
      }

      req.then(function (res) {
        state.accessToken = res.accessToken;
        localStorage.setItem(TOKEN_KEY, res.accessToken);
        loadAccount();
      }).catch(function (err) {
        renderAuthScreen(mode, err.message);
      });
    });
  }

  // Two stages: 'request' (enter email/phone, get a code emailed) and
  // 'reset' (enter that code + a new password). reset-password itself
  // only changes the password (returns {message}, no session) — matching
  // the live mobile app's own forgot-password flow (sorted-app/src/app/
  // password.tsx), a normal /auth/login call with the new password is
  // what actually signs the user in afterward.
  function renderForgotPasswordScreen(stage, opts) {
    opts = opts || {};
    var identifier = opts.identifier || '';

    if (stage === 'request') {
      render(
        '<div class="card">' +
        '<h1 class="title">Reset your password</h1>' +
        '<p class="sub">Enter the email or phone on your account and we\'ll send a reset code.</p>' +
        (opts.errorMsg ? '<div class="banner error">' + escapeHtml(opts.errorMsg) + '</div>' : '') +
        '<form id="forgot-form">' +
          '<label for="fp-identifier">Email or phone</label><input id="fp-identifier" required value="' + escapeHtml(identifier) + '">' +
          '<button type="submit" class="btn btn-primary" id="forgot-submit">Send reset code</button>' +
        '</form>' +
        '<button type="button" class="btn btn-ghost" id="back-to-login">Back to log in</button>' +
        '</div>'
      );

      document.getElementById('back-to-login').addEventListener('click', function () { renderAuthScreen('login'); });
      document.getElementById('forgot-form').addEventListener('submit', function (e) {
        e.preventDefault();
        var submitBtn = document.getElementById('forgot-submit');
        submitBtn.disabled = true;
        submitBtn.textContent = 'Please wait…';
        var enteredIdentifier = document.getElementById('fp-identifier').value.trim();

        api('/auth/forgot-password', { method: 'POST', body: { identifier: enteredIdentifier } })
          .then(function () {
            renderForgotPasswordScreen('reset', { identifier: enteredIdentifier });
          })
          .catch(function (err) {
            renderForgotPasswordScreen('request', { identifier: enteredIdentifier, errorMsg: err.message });
          });
      });
      return;
    }

    // stage === 'reset'
    render(
      '<div class="card">' +
      '<h1 class="title">Check your email</h1>' +
      '<p class="sub">If an account exists for that email or phone, a reset code has been sent. Enter it below with your new password.</p>' +
      (opts.errorMsg ? '<div class="banner error">' + escapeHtml(opts.errorMsg) + '</div>' : '') +
      '<form id="reset-form">' +
        '<label for="rp-code">Code from your email</label><input id="rp-code" required inputmode="numeric" pattern="\\d{6}" maxlength="6" placeholder="6 digits">' +
        '<div class="field-row"><label for="rp-password">New password</label><input id="rp-password" type="password" required minlength="8">' +
          '<button type="button" class="field-toggle" data-target="rp-password">Show</button></div>' +
        '<button type="submit" class="btn btn-primary" id="reset-submit">Save password and log in</button>' +
      '</form>' +
      '<button type="button" class="btn-link" id="resend-code">Send a new code</button>' +
      '<button type="button" class="btn btn-ghost" id="back-to-login">Back to log in</button>' +
      '</div>'
    );

    var resetToggle = app.querySelector('.field-toggle');
    if (resetToggle) {
      resetToggle.addEventListener('click', function () {
        var input = document.getElementById(resetToggle.getAttribute('data-target'));
        var showing = input.type === 'text';
        input.type = showing ? 'password' : 'text';
        resetToggle.textContent = showing ? 'Show' : 'Hide';
      });
    }

    document.getElementById('back-to-login').addEventListener('click', function () { renderAuthScreen('login'); });
    document.getElementById('resend-code').addEventListener('click', function () { renderForgotPasswordScreen('request', { identifier: identifier }); });

    document.getElementById('reset-form').addEventListener('submit', function (e) {
      e.preventDefault();
      var submitBtn = document.getElementById('reset-submit');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Please wait…';
      var code = document.getElementById('rp-code').value.trim();
      var newPassword = document.getElementById('rp-password').value;

      api('/auth/reset-password', { method: 'POST', body: { identifier: identifier, code: code, newPassword: newPassword } })
        .then(function () {
          return api('/auth/login', { method: 'POST', body: { identifier: identifier, password: newPassword } });
        })
        .then(function (res) {
          state.accessToken = res.accessToken;
          localStorage.setItem(TOKEN_KEY, res.accessToken);
          loadAccount();
        })
        .catch(function (err) {
          renderForgotPasswordScreen('reset', { identifier: identifier, errorMsg: err.message });
        });
    });
  }

  function renderLoadingCard(label) {
    render('<div class="card skeleton"><div class="spinner"></div><span>' + escapeHtml(label || 'Loading…') + '</span></div>');
  }

  function renderIdentityScreen(errorMsg) {
    render(
      '<div class="card">' +
      '<h1 class="title">One more step</h1>' +
      '<p class="sub">We verify your BVN to open your own account number — this is the same number people pay your salary or deposits into.</p>' +
      (errorMsg ? '<div class="banner error">' + escapeHtml(errorMsg) + '</div>' : '') +
      '<form id="identity-form">' +
        '<label for="i-first">First name</label><input id="i-first" required maxlength="200">' +
        '<label for="i-last">Last name</label><input id="i-last" required maxlength="200">' +
        '<label for="i-bvn">BVN</label><input id="i-bvn" required inputmode="numeric" pattern="\\d{11}" maxlength="11" placeholder="11 digits">' +
        '<p class="hint">Your BVN is sent directly to our banking partner to verify your identity — it is never stored on our side.</p>' +
        '<button type="submit" class="btn btn-primary" id="identity-submit">Verify and continue</button>' +
      '</form>' +
      '<button type="button" class="btn btn-ghost" id="logout-link">Log out</button>' +
      '</div>'
    );

    document.getElementById('logout-link').addEventListener('click', logout);

    document.getElementById('identity-form').addEventListener('submit', function (e) {
      e.preventDefault();
      var bvn = document.getElementById('i-bvn').value.trim();
      if (!/^\d{11}$/.test(bvn)) {
        renderIdentityScreen('BVN must be exactly 11 digits.');
        return;
      }
      var submitBtn = document.getElementById('identity-submit');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Verifying…';

      api('/enough/account', {
        method: 'POST',
        auth: true,
        body: {
          firstName: document.getElementById('i-first').value.trim(),
          lastName: document.getElementById('i-last').value.trim(),
          bvn: bvn,
        },
      }).then(function (view) {
        renderAccountView(view);
      }).catch(function (err) {
        renderIdentityScreen(err.message);
      });
    });
  }

  function renderWaitingScreen(view) {
    render(
      '<div class="card">' +
      '<span class="status-pill pending">Verifying</span>' +
      '<h1 class="title" style="margin-top:14px">Almost there</h1>' +
      '<p class="sub">' + escapeHtml(view.statusDetail || 'Your BVN is being verified with our banking partner. This usually takes a few minutes.') + '</p>' +
      '<button type="button" class="btn btn-primary" id="refresh-btn">Check status</button>' +
      '<button type="button" class="btn btn-ghost" id="logout-link">Log out</button>' +
      '</div>'
    );
    document.getElementById('logout-link').addEventListener('click', logout);
    document.getElementById('refresh-btn').addEventListener('click', function () {
      var btn = document.getElementById('refresh-btn');
      btn.disabled = true;
      btn.textContent = 'Checking…';
      loadAccount();
    });
  }

  function renderUnsupportedScreen(view) {
    render(
      '<div class="card">' +
      '<span class="status-pill unsupported">Not available</span>' +
      '<h1 class="title" style="margin-top:14px">We couldn\'t verify this account</h1>' +
      '<p class="sub">' + escapeHtml(view.statusDetail || 'Something about this identity could not be verified. Please contact support.') + '</p>' +
      '<button type="button" class="btn btn-ghost" id="logout-link">Log out</button>' +
      '</div>'
    );
    document.getElementById('logout-link').addEventListener('click', logout);
  }

  function renderAccountView(view) {
    if (view.status === 'unrequested') { renderIdentityScreen(); return; }
    if (view.status === 'pending' || view.status === 'restricted') { renderWaitingScreen(view); return; }
    if (view.status === 'unsupported') { renderUnsupportedScreen(view); return; }

    // active
    loadActivePanel(view);
  }

  // ---------- active panel: tabbed nav (Home / Savings / Make Payment / Profile) ----------

  var activeTab = 'home';
  var activeUi = {
    allocatingPurposeId: null, showCreateForm: false, pinMode: null, planPreview: null,
    viewingTranchesId: null, trancheData: null, unlockingTrancheId: null, editingScheduleId: null,
  };

  var TABS = [['home', 'Home'], ['savings', 'Savings'], ['payment', 'Pay'], ['history', 'History'], ['profile', 'Profile']];

  function loadActivePanel(view) {
    render(
      '<div class="tabbar">' +
      TABS.map(function (t) {
        return '<button type="button" class="tab-btn' + (activeTab === t[0] ? ' active' : '') + '" data-tab="' + t[0] + '">' + t[1] + '</button>';
      }).join('') +
      '</div>' +
      '<div id="tab-content"></div>'
    );
    Array.prototype.forEach.call(app.querySelectorAll('.tab-btn'), function (btn) {
      btn.addEventListener('click', function () {
        activeTab = btn.getAttribute('data-tab');
        loadActivePanel(view);
      });
    });
    if (activeTab === 'home') renderHomeTab(view);
    else if (activeTab === 'savings') loadSavingsTab(view);
    else if (activeTab === 'payment') loadPaymentTab(view);
    else if (activeTab === 'history') loadHistoryTab();
    else if (activeTab === 'profile') loadProfileTab(view);
  }

  // ---------- Home tab ----------

  function renderHomeTab(view) {
    var hasAccountNumber = !!view.virtualAccountNumber;
    var el = document.getElementById('tab-content');
    el.innerHTML =
      '<div class="card">' +
      '<span class="status-pill active">Active</span>' +
      '<p class="balance-label" style="margin-top:16px">Landing spot</p>' +
      '<p class="balance">' + formatNaira(view.availableBalanceKobo) + '</p>' +
      '<p class="hint" style="margin-top:8px">Every deposit lands here first. Push it into a purpose from the Savings tab whenever you decide what it\'s for.</p>' +
      '</div>' +
      '<div class="card">' +
      (hasAccountNumber
        ? '<p class="balance-label">Your account number</p>' +
          '<p class="acct-number">' + escapeHtml(formatAccountNumber(view.virtualAccountNumber)) + '</p>' +
          '<p class="acct-bank">' + escapeHtml(view.bankName || '') + '</p>' +
          '<div class="row" style="margin-top:16px">' +
            '<span class="muted" style="font-size:14px">Account name: ' + escapeHtml(view.accountName || '') + '</span>' +
            '<button type="button" class="copy-btn" id="copy-btn">Copy</button>' +
          '</div>'
        : '<p class="sub" style="margin:0">Your account is active — your account number is being issued and will appear here shortly.</p>' +
          '<button type="button" class="btn btn-primary" id="refresh-btn">Check again</button>') +
      '</div>';

    var copyBtn = document.getElementById('copy-btn');
    if (copyBtn) {
      copyBtn.addEventListener('click', function () {
        navigator.clipboard.writeText(view.virtualAccountNumber).then(function () {
          copyBtn.textContent = 'Copied';
          setTimeout(function () { copyBtn.textContent = 'Copy'; }, 1500);
        });
      });
    }
    var refreshBtn = document.getElementById('refresh-btn');
    if (refreshBtn) {
      refreshBtn.addEventListener('click', function () {
        refreshBtn.disabled = true;
        refreshBtn.textContent = 'Checking…';
        loadAccount();
      });
    }
  }

  // ---------- Savings tab (purposes) ----------

  function loadSavingsTab(view) {
    var el = document.getElementById('tab-content');
    el.innerHTML = '<div class="card skeleton"><div class="spinner"></div><span>Loading…</span></div>';
    api('/enough/purposes', { auth: true }).then(function (purposes) {
      renderSavingsTab(view, purposes);
    }).catch(function (err) {
      renderSavingsTab(view, [], err.message);
    });
  }

  function trancheListHtml(purposeId, tranches) {
    var rows = tranches.map(function (t) {
      var status = t.releasedEarly ? 'Unlocked early' : (t.released ? 'Available' : 'Locked until ' + formatHistoryDate(t.releaseAt));
      var isUnlocking = activeUi.unlockingTrancheId === t.id;
      return '<div class="tranche-row">' +
        '<div class="tranche-row-main">' +
          '<span>' + formatNaira(t.amountKobo) + '</span>' +
          '<span class="muted" style="font-size:12.5px">' + status + '</span>' +
        '</div>' +
        (!t.released
          ? (isUnlocking
              ? '<form class="unlock-tranche-form" data-tranche-id="' + t.id + '">' +
                  '<input type="text" inputmode="numeric" maxlength="4" pattern="\\d{4}" placeholder="PIN" class="unlock-pin" required>' +
                  '<button type="submit" class="btn btn-small btn-primary-small">Unlock</button>' +
                  '<button type="button" class="btn btn-small btn-ghost-small cancel-unlock">Cancel</button>' +
                '</form>'
              : '<button type="button" class="push-link unlock-tranche-btn" data-tranche-id="' + t.id + '">Unlock now</button>')
          : '') +
        '</div>';
    }).join('');

    var hasPending = tranches.some(function (t) { return !t.released; });
    return '<div class="tranche-list">' + rows + '</div>' +
      (hasPending
        ? (activeUi.editingScheduleId === purposeId
            ? '<form class="extend-schedule-form" style="margin-top:10px">' +
                '<input type="number" min="1" max="90" placeholder="New days apart" class="extend-interval" required>' +
                '<button type="submit" class="btn btn-small btn-primary-small">Save</button>' +
                '<button type="button" class="btn btn-small btn-ghost-small cancel-extend">Cancel</button>' +
              '</form>'
            : '<button type="button" class="push-link" id="adjust-schedule-btn" style="margin-top:8px">Adjust remaining schedule</button>')
        : '');
  }

  function renderSavingsTab(view, purposes, purposesError) {
    var purposeRows = purposes.map(function (p) {
      var isAllocating = activeUi.allocatingPurposeId === p.id;
      var isViewingTranches = activeUi.viewingTranchesId === p.id;
      var hasLocked = Number(p.lockedKobo) > 0;
      return (
        '<div class="purpose-row">' +
          '<div class="purpose-row-main">' +
            '<span class="purpose-name">' + escapeHtml(p.name) + (p.targetPercent ? '<span class="target-pill">Target ' + p.targetPercent + '%</span>' : '') + '</span>' +
            '<span class="purpose-balance">' + formatNaira(p.balanceKobo) + '</span>' +
          '</div>' +
          (hasLocked
            ? '<p class="hint" style="margin:4px 0 0">🔒 ' + formatNaira(p.lockedKobo) + ' locked &middot; <button type="button" class="push-link" data-view-tranches-id="' + p.id + '" style="font-size:13px">' + (isViewingTranches ? 'Hide schedule' : 'View schedule') + '</button></p>'
            : '') +
          (isViewingTranches && activeUi.trancheData ? '<div style="margin-top:8px">' + trancheListHtml(p.id, activeUi.trancheData) + '</div>' : '') +
          (isAllocating
            ? '<form class="allocate-form" data-purpose-id="' + p.id + '">' +
                '<input type="number" min="0.01" step="0.01" placeholder="Amount (₦)" required class="allocate-amount">' +
                '<label style="display:flex;align-items:center;gap:6px;font-size:13px;font-weight:400;margin:10px 0 0;color:var(--muted)">' +
                  '<input type="checkbox" class="allocate-schedule-toggle" style="width:auto;height:auto;flex:none">' +
                  'Split into tranches over time' +
                '</label>' +
                '<div class="schedule-fields" style="display:none;gap:8px;margin-top:8px">' +
                  '<input type="number" class="schedule-tranches" placeholder="Parts" min="1" max="90" style="width:80px">' +
                  '<input type="number" class="schedule-interval" placeholder="Days apart" min="1" max="90" style="width:110px">' +
                '</div>' +
                '<div class="btn-small-row">' +
                  '<button type="submit" class="btn btn-small btn-primary-small">Push</button>' +
                  '<button type="button" class="btn btn-small btn-ghost-small cancel-allocate">Cancel</button>' +
                '</div>' +
              '</form>'
            : '<button type="button" class="push-link" data-purpose-id="' + p.id + '" style="margin-top:8px">Push money in</button>')
        + '</div>'
      );
    }).join('');

    var el = document.getElementById('tab-content');
    el.innerHTML =
      '<div class="card">' +
      '<p class="balance-label">Landing spot</p>' +
      '<p class="balance" style="font-size:26px">' + formatNaira(view.availableBalanceKobo) + '</p>' +
      '</div>' +
      '<div class="card">' +
      '<p class="balance-label" style="margin-bottom:10px">Your purposes</p>' +
      (purposesError ? '<div class="banner error">' + escapeHtml(purposesError) + '</div>' : '') +
      (purposes.length
        ? '<div class="purpose-list">' + purposeRows + '</div>'
        : '<p class="empty-purposes">No purposes yet — create one below, then push money into it from your landing spot.</p>') +
      (activeUi.showCreateForm
        ? '<form id="create-purpose-form" class="new-purpose-form">' +
            '<label for="new-purpose-name">Purpose name</label>' +
            '<input id="new-purpose-name" required maxlength="100" placeholder="e.g. Rent">' +
            '<div class="btn-small-row">' +
              '<button type="submit" class="btn btn-small btn-primary-small">Create</button>' +
              '<button type="button" class="btn btn-small btn-ghost-small" id="cancel-create-purpose">Cancel</button>' +
            '</div>' +
          '</form>'
        : '<button type="button" class="push-link" id="show-create-purpose" style="margin-top:12px">+ New purpose</button>') +
      '</div>';

    Array.prototype.forEach.call(app.querySelectorAll('.push-link[data-purpose-id]'), function (btn) {
      btn.addEventListener('click', function () {
        activeUi.allocatingPurposeId = btn.getAttribute('data-purpose-id');
        renderSavingsTab(view, purposes);
      });
    });
    var cancelAllocate = app.querySelector('.cancel-allocate');
    if (cancelAllocate) {
      cancelAllocate.addEventListener('click', function () {
        activeUi.allocatingPurposeId = null;
        renderSavingsTab(view, purposes);
      });
    }
    var allocateForm = app.querySelector('.allocate-form');
    if (allocateForm) {
      var scheduleToggle = allocateForm.querySelector('.allocate-schedule-toggle');
      var scheduleFields = allocateForm.querySelector('.schedule-fields');
      scheduleToggle.addEventListener('change', function () {
        scheduleFields.style.display = scheduleToggle.checked ? 'flex' : 'none';
      });
      allocateForm.addEventListener('submit', function (e) {
        e.preventDefault();
        var purposeId = allocateForm.getAttribute('data-purpose-id');
        var nairaAmount = parseFloat(allocateForm.querySelector('.allocate-amount').value);
        if (!nairaAmount || nairaAmount <= 0) return;
        var amountKobo = Math.round(nairaAmount * 100);
        var body = { amountKobo: amountKobo };
        if (scheduleToggle.checked) {
          var tranches = parseInt(allocateForm.querySelector('.schedule-tranches').value, 10);
          var intervalDays = parseInt(allocateForm.querySelector('.schedule-interval').value, 10);
          if (!tranches || !intervalDays) { renderSavingsTab(view, purposes, 'Enter how many parts and how many days apart.'); return; }
          body.schedule = { tranches: tranches, intervalDays: intervalDays };
        }
        var submitBtn = allocateForm.querySelector('button[type="submit"]');
        submitBtn.disabled = true;
        submitBtn.textContent = 'Pushing…';
        api('/enough/purposes/' + encodeURIComponent(purposeId) + '/allocate', {
          method: 'POST', auth: true, body: body,
        }).then(function () {
          activeUi.allocatingPurposeId = null;
          loadAccount();
        }).catch(function (err) {
          renderSavingsTab(view, purposes, err.message);
        });
      });
    }

    Array.prototype.forEach.call(app.querySelectorAll('.push-link[data-view-tranches-id]'), function (btn) {
      btn.addEventListener('click', function () {
        var id = btn.getAttribute('data-view-tranches-id');
        if (activeUi.viewingTranchesId === id) {
          activeUi.viewingTranchesId = null;
          activeUi.trancheData = null;
          renderSavingsTab(view, purposes);
          return;
        }
        activeUi.viewingTranchesId = id;
        activeUi.unlockingTrancheId = null;
        activeUi.editingScheduleId = null;
        api('/enough/purposes/' + encodeURIComponent(id) + '/tranches', { auth: true }).then(function (tranches) {
          activeUi.trancheData = tranches;
          renderSavingsTab(view, purposes);
        }).catch(function (err) {
          renderSavingsTab(view, purposes, err.message);
        });
      });
    });

    Array.prototype.forEach.call(app.querySelectorAll('.unlock-tranche-btn'), function (btn) {
      btn.addEventListener('click', function () {
        activeUi.unlockingTrancheId = btn.getAttribute('data-tranche-id');
        renderSavingsTab(view, purposes);
      });
    });
    var cancelUnlock = app.querySelector('.cancel-unlock');
    if (cancelUnlock) {
      cancelUnlock.addEventListener('click', function () {
        activeUi.unlockingTrancheId = null;
        renderSavingsTab(view, purposes);
      });
    }
    var unlockForm = app.querySelector('.unlock-tranche-form');
    if (unlockForm) {
      unlockForm.addEventListener('submit', function (e) {
        e.preventDefault();
        var trancheId = unlockForm.getAttribute('data-tranche-id');
        var pin = unlockForm.querySelector('.unlock-pin').value.trim();
        if (!/^\d{4}$/.test(pin)) { renderSavingsTab(view, purposes, 'Enter your 4-digit PIN.'); return; }
        var submitBtn = unlockForm.querySelector('button[type="submit"]');
        submitBtn.disabled = true;
        submitBtn.textContent = 'Unlocking…';
        api('/enough/purposes/' + encodeURIComponent(activeUi.viewingTranchesId) + '/tranches/' + encodeURIComponent(trancheId) + '/unlock', {
          method: 'POST', auth: true, body: { pin: pin },
        }).then(function (tranches) {
          activeUi.unlockingTrancheId = null;
          activeUi.trancheData = tranches;
          renderSavingsTab(view, purposes);
        }).catch(function (err) {
          renderSavingsTab(view, purposes, err.message);
        });
      });
    }

    var adjustScheduleBtn = document.getElementById('adjust-schedule-btn');
    if (adjustScheduleBtn) {
      adjustScheduleBtn.addEventListener('click', function () {
        activeUi.editingScheduleId = activeUi.viewingTranchesId;
        renderSavingsTab(view, purposes);
      });
    }
    var cancelExtend = app.querySelector('.cancel-extend');
    if (cancelExtend) {
      cancelExtend.addEventListener('click', function () {
        activeUi.editingScheduleId = null;
        renderSavingsTab(view, purposes);
      });
    }
    var extendForm = app.querySelector('.extend-schedule-form');
    if (extendForm) {
      extendForm.addEventListener('submit', function (e) {
        e.preventDefault();
        var intervalDays = parseInt(extendForm.querySelector('.extend-interval').value, 10);
        if (!intervalDays) return;
        var submitBtn = extendForm.querySelector('button[type="submit"]');
        submitBtn.disabled = true;
        submitBtn.textContent = 'Saving…';
        api('/enough/purposes/' + encodeURIComponent(activeUi.viewingTranchesId) + '/tranches/schedule', {
          method: 'PATCH', auth: true, body: { intervalDays: intervalDays },
        }).then(function (tranches) {
          activeUi.editingScheduleId = null;
          activeUi.trancheData = tranches;
          renderSavingsTab(view, purposes);
        }).catch(function (err) {
          renderSavingsTab(view, purposes, err.message);
        });
      });
    }

    var showCreateBtn = document.getElementById('show-create-purpose');
    if (showCreateBtn) {
      showCreateBtn.addEventListener('click', function () {
        activeUi.showCreateForm = true;
        renderSavingsTab(view, purposes);
      });
    }
    var cancelCreateBtn = document.getElementById('cancel-create-purpose');
    if (cancelCreateBtn) {
      cancelCreateBtn.addEventListener('click', function () {
        activeUi.showCreateForm = false;
        renderSavingsTab(view, purposes);
      });
    }
    var createForm = document.getElementById('create-purpose-form');
    if (createForm) {
      createForm.addEventListener('submit', function (e) {
        e.preventDefault();
        var name = document.getElementById('new-purpose-name').value.trim();
        if (!name) return;
        var submitBtn = createForm.querySelector('button[type="submit"]');
        submitBtn.disabled = true;
        submitBtn.textContent = 'Creating…';
        api('/enough/purposes', { method: 'POST', auth: true, body: { name: name } }).then(function () {
          activeUi.showCreateForm = false;
          loadSavingsTab(view);
        }).catch(function (err) {
          renderSavingsTab(view, purposes, err.message);
        });
      });
    }
  }

  // ---------- Make Payment tab ----------

  function loadPaymentTab(view) {
    var el = document.getElementById('tab-content');
    el.innerHTML = '<div class="card skeleton"><div class="spinner"></div><span>Loading…</span></div>';
    Promise.all([
      api('/enough/purposes', { auth: true }),
      api('/enough/payments/banks', { auth: true }),
      api('/enough/payments', { auth: true }),
    ]).then(function (results) {
      renderPaymentTab(view, results[0], results[1], results[2]);
    }).catch(function (err) {
      el.innerHTML = '<div class="card"><div class="banner error">' + escapeHtml(err.message) + '</div></div>';
    });
  }

  function paymentStatusLabel(status) {
    if (status === 'completed') return 'Completed';
    if (status === 'failed') return 'Failed — refunded';
    return 'Processing';
  }

  function renderPaymentTab(view, purposes, banks, payments, formError) {
    var el = document.getElementById('tab-content');

    var sourceOptions = '<option value="landing_spot">Landing spot — ' + formatNaira(view.availableBalanceKobo) + '</option>' +
      purposes.map(function (p) {
        var availableKobo = Number(p.balanceKobo) - Number(p.lockedKobo);
        return '<option value="purpose:' + p.id + '">' + escapeHtml(p.name) + ' — ' + formatNaira(String(availableKobo)) + ' available</option>';
      }).join('');

    var bankOptions = banks.map(function (b) {
      return '<option value="' + escapeHtml(b.code) + '">' + escapeHtml(b.name) + '</option>';
    }).join('');

    var paymentRows = payments.map(function (p) {
      return '<div class="history-row">' +
        '<div class="history-row-main">' +
          '<span class="history-label">To ' + escapeHtml(p.recipientAccountName) + '</span>' +
          '<span class="history-amount-out">&minus; ' + formatNaira(p.amountKobo) + '</span>' +
        '</div>' +
        '<span class="history-date">' + paymentStatusLabel(p.status) + (p.failureReason ? ' — ' + escapeHtml(p.failureReason) : '') + '</span>' +
        '</div>';
    }).join('');

    el.innerHTML =
      '<div class="card">' +
      '<p class="balance-label" style="margin-bottom:10px">Make a payment</p>' +
      (formError ? '<div class="banner error">' + escapeHtml(formError) + '</div>' : '') +
      (banks.length === 0
        ? '<p class="sub" style="margin:0">Payments aren\'t available right now — try again shortly.</p>'
        : '<form id="payment-form">' +
            '<label for="payment-source">Pay from</label>' +
            '<select id="payment-source">' + sourceOptions + '</select>' +
            '<label for="payment-bank">Bank</label>' +
            '<select id="payment-bank">' + bankOptions + '</select>' +
            '<label for="payment-account-number">Account number</label>' +
            '<input id="payment-account-number" inputmode="numeric" maxlength="20" required>' +
            '<div class="btn-small-row">' +
              '<button type="button" class="btn btn-small btn-ghost-small" id="resolve-account-btn">Resolve account</button>' +
            '</div>' +
            '<p class="hint" id="resolved-name-display" style="display:none;margin-top:8px"></p>' +
            '<label for="payment-amount" style="margin-top:14px">Amount (₦)</label>' +
            '<input id="payment-amount" type="number" min="0.01" step="0.01" required>' +
            '<label for="payment-pin">Transaction PIN</label>' +
            '<input id="payment-pin" inputmode="numeric" maxlength="4" pattern="\\d{4}" required>' +
            '<button type="submit" class="btn btn-primary" id="send-payment-btn" disabled>Resolve the account first</button>' +
          '</form>') +
      '</div>' +
      '<div class="card">' +
      '<p class="balance-label" style="margin-bottom:10px">Recent payments</p>' +
      (payments.length ? '<div class="history-list">' + paymentRows + '</div>' : '<p class="empty-purposes">No payments yet.</p>') +
      '</div>';

    var resolveBtn = document.getElementById('resolve-account-btn');
    var sendBtn = document.getElementById('send-payment-btn');
    var resolvedNameDisplay = document.getElementById('resolved-name-display');
    var resolvedName = null;

    if (resolveBtn) {
      resolveBtn.addEventListener('click', function () {
        var bankCode = document.getElementById('payment-bank').value;
        var accountNumber = document.getElementById('payment-account-number').value.trim();
        if (!accountNumber) return;
        resolveBtn.disabled = true;
        resolveBtn.textContent = 'Resolving…';
        resolvedNameDisplay.style.display = 'none';
        api('/enough/payments/resolve', { method: 'POST', auth: true, body: { bankCode: bankCode, accountNumber: accountNumber } }).then(function (resolved) {
          resolvedName = resolved.accountName;
          resolvedNameDisplay.textContent = 'Resolved: ' + resolved.accountName;
          resolvedNameDisplay.style.display = 'block';
          resolveBtn.disabled = false;
          resolveBtn.textContent = 'Resolve account';
          sendBtn.disabled = false;
          sendBtn.textContent = 'Send payment';
        }).catch(function (err) {
          resolveBtn.disabled = false;
          resolveBtn.textContent = 'Resolve account';
          renderPaymentTab(view, purposes, banks, payments, err.message);
        });
      });
    }

    var paymentForm = document.getElementById('payment-form');
    if (paymentForm) {
      paymentForm.addEventListener('submit', function (e) {
        e.preventDefault();
        if (!resolvedName) return;
        var sourceValue = document.getElementById('payment-source').value;
        var source = sourceValue === 'landing_spot'
          ? { type: 'landing_spot' }
          : { type: 'purpose', purposeId: sourceValue.slice('purpose:'.length) };
        var bankCode = document.getElementById('payment-bank').value;
        var accountNumber = document.getElementById('payment-account-number').value.trim();
        var nairaAmount = parseFloat(document.getElementById('payment-amount').value);
        var pin = document.getElementById('payment-pin').value.trim();
        if (!nairaAmount || nairaAmount <= 0) return;
        if (!/^\d{4}$/.test(pin)) { renderPaymentTab(view, purposes, banks, payments, 'Enter your 4-digit PIN.'); return; }
        sendBtn.disabled = true;
        sendBtn.textContent = 'Sending…';
        api('/enough/payments', {
          method: 'POST', auth: true,
          body: { source: source, amountKobo: Math.round(nairaAmount * 100), bankCode: bankCode, accountNumber: accountNumber, pin: pin },
        }).then(function () {
          loadAccount();
        }).catch(function (err) {
          renderPaymentTab(view, purposes, banks, payments, err.message);
        });
      });
    }
  }

  // ---------- History tab ----------

  function formatHistoryDate(iso) {
    var d = new Date(iso);
    return d.toLocaleDateString('en-NG', { day: 'numeric', month: 'short' }) + ', ' + d.toLocaleTimeString('en-NG', { hour: 'numeric', minute: '2-digit' });
  }

  function loadHistoryTab() {
    var el = document.getElementById('tab-content');
    el.innerHTML = '<div class="card skeleton"><div class="spinner"></div><span>Loading…</span></div>';
    api('/enough/account/history', { auth: true }).then(function (entries) {
      renderHistoryTab(entries);
    }).catch(function (err) {
      el.innerHTML = '<div class="card"><div class="banner error">' + escapeHtml(err.message) + '</div></div>';
    });
  }

  function renderHistoryTab(entries) {
    var el = document.getElementById('tab-content');
    if (!entries.length) {
      el.innerHTML = '<div class="card"><p class="empty-purposes">No activity yet — once a deposit lands or you push money into a purpose, it\'ll show up here.</p></div>';
      return;
    }
    var rows = entries.map(function (e) {
      var isDeposit = e.type === 'deposit';
      var label = isDeposit ? 'Deposit received' : 'Pushed into ' + escapeHtml(e.purposeName || '');
      return (
        '<div class="history-row">' +
          '<div class="history-row-main">' +
            '<span class="history-label">' + label + '</span>' +
            '<span class="' + (isDeposit ? 'history-amount-in' : 'history-amount-out') + '">' + (isDeposit ? '+ ' : '− ') + formatNaira(e.amountKobo) + '</span>' +
          '</div>' +
          '<span class="history-date">' + formatHistoryDate(e.occurredAt) + '</span>' +
        '</div>'
      );
    }).join('');
    el.innerHTML = '<div class="card"><div class="history-list">' + rows + '</div></div>';
  }

  // ---------- Profile tab ----------

  function loadProfileTab(view) {
    var el = document.getElementById('tab-content');
    el.innerHTML = '<div class="card skeleton"><div class="spinner"></div><span>Loading…</span></div>';
    api('/me', { auth: true }).then(function (me) {
      renderProfileTab(view, me);
    }).catch(function (err) {
      el.innerHTML = '<div class="card"><div class="banner error">' + escapeHtml(err.message) + '</div></div>';
    });
  }

  function pinFormHtml(hasExisting) {
    return '<form id="pin-form">' +
      (hasExisting ? '<label for="pin-current">Current PIN</label><input id="pin-current" inputmode="numeric" maxlength="4" pattern="\\d{4}" required>' : '') +
      '<label for="pin-new">New PIN</label><input id="pin-new" inputmode="numeric" maxlength="4" pattern="\\d{4}" required>' +
      '<label for="pin-confirm">Confirm new PIN</label><input id="pin-confirm" inputmode="numeric" maxlength="4" pattern="\\d{4}" required>' +
      '<div class="btn-small-row">' +
        '<button type="submit" class="btn btn-small btn-primary-small">Save PIN</button>' +
        '<button type="button" class="btn btn-small btn-ghost-small" id="cancel-pin-btn">Cancel</button>' +
      '</div>' +
      '</form>';
  }

  function planReviewHtml(purposes) {
    var rows = purposes.map(function (p, i) {
      return '<div class="plan-row" data-index="' + i + '">' +
        '<input type="text" class="plan-name" value="' + escapeHtml(p.name) + '" maxlength="100">' +
        '<input type="number" class="plan-percent" value="' + p.targetPercent + '" min="1" max="100">' +
        '<span class="muted" style="font-size:13px">%</span>' +
        '</div>';
    }).join('');
    return '<div class="plan-review">' + rows + '</div>' +
      '<div class="btn-small-row">' +
        '<button type="button" class="btn btn-small btn-primary-small" id="apply-plan-btn">Apply plan</button>' +
        '<button type="button" class="btn btn-small btn-ghost-small" id="discard-plan-btn">Discard</button>' +
      '</div>';
  }

  function renderProfileTab(view, me, bannerError) {
    var el = document.getElementById('tab-content');
    var pinMode = activeUi.pinMode;
    el.innerHTML =
      '<div class="card">' +
      '<p class="balance-label">Name</p><p style="margin:2px 0 14px;font-size:16px;font-weight:700">' + escapeHtml(me.name || '') + '</p>' +
      '<p class="balance-label">Email</p><p style="margin:2px 0 14px;font-size:16px">' + escapeHtml(me.email || '') + '</p>' +
      '<p class="balance-label">Phone</p><p style="margin:2px 0 14px;font-size:16px">' + escapeHtml(me.phone || '') + '</p>' +
      '<p class="balance-label">State</p><p style="margin:2px 0 0;font-size:16px">' + escapeHtml(me.state || '') + '</p>' +
      '</div>' +
      '<div class="card">' +
      '<p class="balance-label" style="margin-bottom:10px">Describe yourself</p>' +
      (bannerError ? '<div class="banner error">' + escapeHtml(bannerError) + '</div>' : '') +
      '<p class="hint" style="margin:0 0 10px">Tell us about your life and income in your own words — what you earn, what you pay for, who depends on you. We use this to suggest how to split your money into purposes.</p>' +
      '<textarea id="description-input" rows="4" placeholder="e.g. I\'m a nurse in Lagos paid on the 28th. I pay rent yearly, send money to my mum, and want to save for school fees.">' + escapeHtml(view.description || '') + '</textarea>' +
      '<div class="btn-small-row">' +
        '<button type="button" class="btn btn-small btn-primary-small" id="save-description-btn">Save description</button>' +
        '<button type="button" class="btn btn-small btn-ghost-small" id="generate-plan-btn">Generate my plan</button>' +
      '</div>' +
      (activeUi.planPreview ? '<div style="margin-top:16px;padding-top:16px;border-top:1px dashed var(--line)"><p class="balance-label" style="margin-bottom:10px">Suggested plan — review and adjust</p>' + planReviewHtml(activeUi.planPreview) + '</div>' : '') +
      '</div>' +
      '<div class="card">' +
      '<p class="balance-label" style="margin-bottom:10px">Transaction PIN</p>' +
      (pinMode
        ? pinFormHtml(view.hasTransactionPin)
        : (view.hasTransactionPin
            ? '<div class="row"><span class="muted" style="font-size:14px">PIN is set</span><button type="button" class="push-link" id="change-pin-btn">Change PIN</button></div>'
            : '<p class="sub" style="margin:0 0 10px">Set a 4-digit PIN to protect money leaving your account once that\'s available.</p><button type="button" class="btn btn-primary" id="set-pin-btn">Set transaction PIN</button>')) +
      '</div>' +
      '<button type="button" class="btn btn-ghost" id="logout-link">Log out</button>';

    document.getElementById('logout-link').addEventListener('click', logout);

    document.getElementById('save-description-btn').addEventListener('click', function () {
      var description = document.getElementById('description-input').value.trim();
      if (!description) { renderProfileTab(view, me, 'Write a description first.'); return; }
      var btn = document.getElementById('save-description-btn');
      btn.disabled = true;
      btn.textContent = 'Saving…';
      api('/enough/account/description', { method: 'PATCH', auth: true, body: { description: description } }).then(function () {
        loadAccount();
      }).catch(function (err) {
        renderProfileTab(view, me, err.message);
      });
    });

    document.getElementById('generate-plan-btn').addEventListener('click', function () {
      var btn = document.getElementById('generate-plan-btn');
      btn.disabled = true;
      btn.textContent = 'Thinking…';
      api('/enough/plan/generate', { method: 'POST', auth: true }).then(function (purposes) {
        activeUi.planPreview = purposes;
        renderProfileTab(view, me);
      }).catch(function (err) {
        renderProfileTab(view, me, err.message);
      });
    });

    var applyBtn = document.getElementById('apply-plan-btn');
    if (applyBtn) {
      applyBtn.addEventListener('click', function () {
        var rows = app.querySelectorAll('.plan-row');
        var purposes = Array.prototype.map.call(rows, function (row) {
          return {
            name: row.querySelector('.plan-name').value.trim(),
            targetPercent: parseInt(row.querySelector('.plan-percent').value, 10),
          };
        }).filter(function (p) { return p.name && p.targetPercent >= 1; });
        if (!purposes.length) { renderProfileTab(view, me, 'Add at least one purpose.'); return; }
        applyBtn.disabled = true;
        applyBtn.textContent = 'Applying…';
        api('/enough/plan/apply', { method: 'POST', auth: true, body: { purposes: purposes } }).then(function () {
          activeUi.planPreview = null;
          activeTab = 'savings';
          loadAccount();
        }).catch(function (err) {
          renderProfileTab(view, me, err.message);
        });
      });
    }
    var discardBtn = document.getElementById('discard-plan-btn');
    if (discardBtn) {
      discardBtn.addEventListener('click', function () {
        activeUi.planPreview = null;
        renderProfileTab(view, me);
      });
    }

    var setBtn = document.getElementById('set-pin-btn');
    if (setBtn) setBtn.addEventListener('click', function () { activeUi.pinMode = 'set'; renderProfileTab(view, me); });
    var changeBtn = document.getElementById('change-pin-btn');
    if (changeBtn) changeBtn.addEventListener('click', function () { activeUi.pinMode = 'change'; renderProfileTab(view, me); });

    var pinForm = document.getElementById('pin-form');
    if (pinForm) {
      document.getElementById('cancel-pin-btn').addEventListener('click', function () {
        activeUi.pinMode = null;
        renderProfileTab(view, me);
      });
      pinForm.addEventListener('submit', function (e) {
        e.preventDefault();
        var newPin = document.getElementById('pin-new').value.trim();
        var confirmPin = document.getElementById('pin-confirm').value.trim();
        var currentPinInput = document.getElementById('pin-current');
        var currentPin = currentPinInput ? currentPinInput.value.trim() : undefined;
        if (!/^\d{4}$/.test(newPin)) { renderProfileTab(view, me, 'PIN must be exactly 4 digits.'); return; }
        if (newPin !== confirmPin) { renderProfileTab(view, me, 'PINs do not match.'); return; }
        if (view.hasTransactionPin && !/^\d{4}$/.test(currentPin || '')) { renderProfileTab(view, me, 'Enter your current 4-digit PIN.'); return; }
        var submitBtn = pinForm.querySelector('button[type="submit"]');
        submitBtn.disabled = true;
        submitBtn.textContent = 'Saving…';
        var body = { pin: newPin };
        if (currentPin) body.currentPin = currentPin;
        api('/enough/account/pin', { method: 'PATCH', auth: true, body: body }).then(function () {
          activeUi.pinMode = null;
          loadAccount();
        }).catch(function (err) {
          renderProfileTab(view, me, err.message);
        });
      });
    }
  }

  function logout() {
    state.accessToken = null;
    localStorage.removeItem(TOKEN_KEY);
    activeTab = 'home';
    activeUi = {
      allocatingPurposeId: null, showCreateForm: false, pinMode: null, planPreview: null,
      viewingTranchesId: null, trancheData: null, unlockingTrancheId: null, editingScheduleId: null,
    };
    renderAuthScreen('login');
  }

  function loadAccount() {
    renderLoadingCard('Checking your account…');
    api('/enough/account', { auth: true }).then(function (view) {
      renderAccountView(view);
    }).catch(function (err) {
      if (err.status === 401) {
        logout();
        return;
      }
      render(
        '<div class="card">' +
        '<div class="banner error">' + escapeHtml(err.message) + '</div>' +
        '<button type="button" class="btn btn-primary" id="retry-btn">Try again</button>' +
        '<button type="button" class="btn btn-ghost" id="logout-link">Log out</button>' +
        '</div>'
      );
      document.getElementById('retry-btn').addEventListener('click', loadAccount);
      document.getElementById('logout-link').addEventListener('click', logout);
    });
  }

  // ---------- boot ----------
  if (state.accessToken) {
    loadAccount();
  } else {
    renderAuthScreen('login');
  }
})();
</script>
</body>
</html>
